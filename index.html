<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1633">
<title>Mon Hub Multi-Agents V3</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
--bg:#f4f5f8;--sf:#fff;--tx:#14213d;--mu:#6b7385;
--bd:#dfe3ec;--ac:#1d4ed8;--go:#b8860b;--ok:#15803d;
--er:#b91c1c;--wa:#b45309;--nav:#0b1633;--navt:#c9d3ee;
}
@media(prefers-color-scheme:dark){
:root:not([data-theme=light]){
--bg:#0a1228;--sf:#111c3a;--tx:#e8ecf7;--mu:#8e9ab8;
--bd:#223059;--ac:#6d9bff;--go:#e0b44c;--ok:#4ade80;
--er:#f87171;--wa:#fbbf24;--nav:#060c1e;
}}
:root[data-theme=dark]{
--bg:#0a1228;--sf:#111c3a;--tx:#e8ecf7;--mu:#8e9ab8;
--bd:#223059;--ac:#6d9bff;--go:#e0b44c;--ok:#4ade80;
--er:#f87171;--wa:#fbbf24;--nav:#060c1e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;
background:var(--bg);color:var(--tx);
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)
}
#app{display:grid;grid-template-columns:auto 1fr auto;height:100%}
nav{
background:var(--nav);color:var(--navt);width:220px;overflow:auto;
transition:width .2s;padding:10px 8px
}
nav.c{width:56px}
nav.c .t{display:none}
nav h1{
font-size:15px;margin:6px 8px 14px;color:#fff;
display:flex;gap:8px;align-items:center;cursor:pointer
}
nav button{
all:unset;box-sizing:border-box;display:flex;gap:10px;
align-items:center;width:100%;padding:8px 10px;border-radius:8px;
cursor:pointer;white-space:nowrap
}
nav button:hover{background:#ffffff14}
nav button.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 var(--go)}
nav .n{margin-left:auto;background:var(--go);color:#000;border-radius:9px;padding:0 6px;font-size:11px}
main{overflow:auto;padding:18px 22px;min-width:0}
aside{width:300px;border-left:1px solid var(--bd);background:var(--sf);overflow:auto;padding:14px}
aside.h{display:none}
.top{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;font-weight:600;flex:1}
input,select,textarea{
font:inherit;color:var(--tx);background:var(--sf);
border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%
}
textarea{resize:vertical}
.btn{
font:inherit;cursor:pointer;border:1px solid var(--bd);
background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 12px
}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:var(--er)}
.btn.s{padding:3px 9px;font-size:12px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.big{font-size:28px;font-weight:600}
.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:0 7px;font-size:11px;margin-right:4px}
.ok{color:var(--ok);border-color:var(--ok)}
.er{color:var(--er);border-color:var(--er)}
.wa{color:var(--wa);border-color:var(--wa)}
.go{color:var(--go);border-color:var(--go)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.cc{border:1px solid var(--go);border-radius:12px;padding:14px;background:var(--sf);margin-bottom:14px}
.cc h3{margin:0 0 8px;font-size:14px;color:var(--go)}
.l>div{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--bd)}
.kan{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kan .card{padding:8px}
.empty{padding:26px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:10px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(500px,92vw)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mu)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 15px;border-radius:8px;display:none;z-index:99;max-width:90%}
.bar{display:flex;align-items:flex-end;gap:6px;height:90px}
.bar i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;margin:0}
.task-result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
textarea{min-height:75px}
@media(max-width:760px){
#app{grid-template-columns:auto 1fr}
aside{position:fixed;right:0;top:0;bottom:0;z-index:5}
nav{width:56px}
nav .t{display:none}
main{padding:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>
<div id="app">
<nav id="nav"></nav>
<main id="main"></main>
<aside id="side" class="h"></aside>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
'use strict';

/* ==========================================================
   MON HUB MULTI-AGENTS V3
   Supabase + AI Gateway + Gemini
   ========================================================== */

/* ================= UTILITAIRES ================= */

const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const uid=p=>p+'_'+crypto.randomUUID().slice(0,8);
const now=()=>new Date().toISOString();
const fmt=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function toast(m){
const t=$('#toast');
t.textContent=m;
t.style.display='block';
clearTimeout(toast.t);
toast.t=setTimeout(()=>t.style.display='none',3500);
}

function clean(s){
return String(s||'').replace(/[<>]/g,'').slice(0,4000);
}

function save(){
Persist.save(S);
}

function audit(a,d){
S.audit.unshift({ts:now(),a,d});
S.audit.length=Math.min(S.audit.length,500);
save();
}

/* ================= PERSISTENCE ================= */

const Persist={
db:null,

async init(){
try{
this.db=await new Promise((ok,ko)=>{
const r=indexedDB.open('hub_v23',1);
r.onupgradeneeded=()=>r.result.createObjectStore('kv');
r.onsuccess=()=>ok(r.result);
r.onerror=()=>ko(r.error);
});
}catch(e){
console.error('IndexedDB indisponible',e);
this.db=null;
}
},

async load(){
if(!this.db)return null;
return new Promise(ok=>{
const q=this.db.transaction('kv').objectStore('kv').get('state');
q.onsuccess=()=>ok(q.result||null);
q.onerror=()=>ok(null);
});
},

save(s){
if(!this.db)return;
try{
this.db.transaction('kv','readwrite')
.objectStore('kv').put(JSON.parse(JSON.stringify(s)),'state');
}catch(e){
console.error('Erreur sauvegarde',e);
}
}
};

/* ================= ÉTAT ================= */

const VER=3;

const CAPS=[
'coordination','vente','marketing','finance','administration',
'recherche','rédaction','technique','analyse','production'
];

const MODELS=[
'local-simulé',
'gemini-3.5-flash-lite',
'gemini-3.8-flash',
'openai-compatible (backend requis)',
'anthropic (backend requis)',
'moteur local (backend requis)'
];

const mkAgent=(name,cat,mission,caps,demo)=>({
id:uid('ag'),name,cat,mission,instr:'',
model:'local-simulé',caps,tools:[],
perms:{actionsSensibles:false},
state:'actif',created:now(),runs:0,fails:0,demo
});

const defaults=()=>({
v:VER,

agents:[
mkAgent('Coordinateur','Agent coordinateur',
'Répartit les demandes entre agents',['coordination'],1),

mkAgent('Commercial','Agent commercial',
'Qualifie les prospects et prépare les relances',['vente','analyse'],1),

mkAgent('Rédacteur','Agent rédactionnel',
'Rédige messages et contenus',['rédaction','marketing'],1),

mkAgent('Analyste','Agent analyste',
'Évalue données et priorités',['analyse','finance','recherche'],1)
],

tasks:[],
workflows:[],
kb:[],
mem:[],
audit:[],
events:[],

cats:[
'Agent coordinateur','Agent commercial','Agent marketing',
'Agent financier','Agent administratif','Agent de recherche',
'Agent rédactionnel','Agent technique','Agent de production',
'Agent analyste','Agent personnel','Agent personnalisé'
],

conn:{},

cfg:{
theme:'auto',
retention:90,
sburl:'',
sbkey:'',
sbSession:null,
model:'gemini-3.5-flash-lite'
}
});

let S=defaults();

function migrate(d){
if(!d)return;

S={
...defaults(),
...d,
cfg:{...defaults().cfg,...(d.cfg||{})}
};

S.v=VER;

S.agents=(S.agents||[]).map(a=>({
...mkAgent(a.name||'Agent','Agent personnalisé',a.mission||'',a.caps||[],0),
...a,
id:a.id||uid('ag'),
caps:a.caps||a.capabilities||[],
state:a.state||'actif',
model:a.model||'local-simulé',
runs:a.runs||0,
fails:a.fails||0
}));

S.tasks=S.tasks||[];
S.workflows=S.workflows||[];
S.kb=S.kb||[];
S.mem=S.mem||[];
S.audit=S.audit||[];
S.events=S.events||[];
}

/* ================= IMPORT ANCIEN HUB ================= */

function importLegacy(){
try{
const o=JSON.parse(localStorage.getItem('HUB_USER_V1')||'null');
if(!o)return 0;

let n=0;

(o.agents||[]).forEach(a=>{
const name=a.name||a.nom||a.n;

if(name&&!S.agents.some(x=>x.name===name)){
S.agents.push(mkAgent(
name,
'Agent personnalisé',
a.mission||a.desc||'Importé de Hub V1',
[],
0
));
n++;
}
});

return n;
}catch{
return 0;
}
}

/* ================= EVENT BUS ================= */

const Bus={
subs:{},

on(t,f){
(this.subs[t]??=[]).push(f);
},

emit(type,source,payload={},o={}){
const e={
id:uid('ev'),
type,
source,
dest:o.dest||null,
ts:now(),
payload,
corr:o.corr||uid('co'),
prio:o.prio||'normale'
};

S.events.unshift(e);
S.events.length=Math.min(S.events.length,500);

[...(this.subs[type]||[]),...(this.subs['*']||[])].forEach(f=>{
try{f(e)}catch(x){console.error(x)}
});

save();
return e;
}
};

Bus.on('*',e=>{
if(['AGENT_FAILED','SYSTEM_ALERT'].includes(e.type)){
toast(e.type+' : '+(e.payload.msg||''));
}
});

/* ================= SÉCURITÉ ================= */

const Sec={
MAX_TASKS:12,
MAX_RETRY:2,

suspect(s){
return /ignore (all|previous)|ignore les instructions|api[_ -]?key|mot de passe/i.test(s);
}
};

/* ================= SUPABASE ================= */

const SB={
session:null,

config(){
return{
url:(S.cfg.sburl||'').trim().replace(/\/$/,''),
key:(S.cfg.sbkey||'').trim()
};
},

get connected(){
const c=this.config();
return !!(c.url&&c.key);
},

get token(){
return this.session?.access_token||this.config().key;
},

headers(extra={}){
const c=this.config();

return{
apikey:c.key,
Authorization:'Bearer '+this.token,
'Content-Type':'application/json',
Accept:'application/json',
...extra
};
},

async request(path,opts={}){
const c=this.config();

if(!c.url||!c.key){
throw new Error('Configurez Supabase dans les Paramètres.');
}

let response;

try{
response=await fetch(c.url+path,{
...opts,
headers:this.headers(opts.headers||{})
});
}catch(e){
throw new Error('Erreur réseau ou CORS : '+e.message);
}

const raw=await response.text();
let data;

try{
data=raw?JSON.parse(raw):null;
}catch{
data=raw;
}

if(!response.ok){
const msg=
data?.message||
data?.msg||
data?.error_description||
data?.details||
data?.hint||
(typeof data==='string'?data:'HTTP '+response.status);

throw new Error('HTTP '+response.status+' — '+msg);
}

return data;
},

setSession(data){
this.session=data||null;

S.cfg.sbSession=this.session?{
access_token:this.session.access_token,
refresh_token:this.session.refresh_token,
token_type:this.session.token_type||'bearer',
expires_at:this.session.expires_at||
(this.session.expires_in?
Math.floor(Date.now()/1000)+this.session.expires_in:null),
user:this.session.user
}:null;

save();
},

async restore(){
const saved=S.cfg.sbSession;

if(!saved?.access_token||!saved?.refresh_token){
return false;
}

this.session=saved;

const exp=Number(saved.expires_at||0);

if(exp&&exp<Date.now()/1000+60){
try{
const d=await this.request('/auth/v1/token?grant_type=refresh_token',{
method:'POST',
body:JSON.stringify({refresh_token:saved.refresh_token})
});

if(d.access_token){
this.setSession(d);
}else{
throw new Error('Jeton absent');
}
}catch(e){
this.session=null;
S.cfg.sbSession=null;
save();
return false;
}
}

return !!this.session?.access_token;
},

async auth(type,email,password){
if(!email||!password){
throw new Error('E-mail et mot de passe obligatoires.');
}

const path=type==='signup'
?'/auth/v1/signup'
:'/auth/v1/token?grant_type=password';

const data=await this.request(path,{
method:'POST',
body:JSON.stringify({email,password})
});

if(data.access_token&&data.refresh_token){
this.setSession(data);
}

return data;
},

logout(){
this.session=null;
S.cfg.sbSession=null;
save();
},

async test(){
return this.request('/rest/v1/agents?select=id&limit=1');
},

async upsertAgent(a){
if(!this.session?.user?.id){
throw new Error('Connectez-vous à Supabase.');
}

const id=a.supabase_id||crypto.randomUUID();

a.supabase_id=id;

const row={
id,
owner_id:this.session.user.id,
name:a.name,
description:a.mission||'',
system_prompt:a.instr||'',
model_provider:a.model.startsWith('gemini')?'gemini':'local',
model_name:a.model||'local-simulé',
status:a.state==='actif'?'active':a.state==='pause'?'paused':'draft',
capabilities:a.caps||[],
permissions:a.perms||{},
config:{
category:a.cat||'Agent personnalisé',
local_id:a.id
},
version:1
};

await this.request('/rest/v1/agents?on_conflict=id',{
method:'POST',
headers:{
Prefer:'resolution=merge-duplicates,return=minimal'
},
body:JSON.stringify(row)
});

return id;
},

async push(){
if(!this.session?.user?.id){
throw new Error('Connectez-vous d’abord.');
}

let n=0;

for(const a of S.agents){
await this.upsertAgent(a);
n++;
}

return n;
},

async pull(){
if(!this.session?.user?.id){
throw new Error('Connectez-vous d’abord.');
}

const owner=this.session.user.id;

const rows=await this.request(
'/rest/v1/agents?select=*&owner_id=eq.'+
encodeURIComponent(owner)+'&order=updated_at.desc'
);

for(const r of rows){

const localId=r.config?.local_id;

let existing=localId
?S.agents.find(a=>a.id===localId)
:S.agents.find(a=>a.supabase_id===r.id);

const mapped={
id:existing?.id||localId||r.id,
supabase_id:r.id,
name:r.name,
cat:r.config?.category||'Agent personnalisé',
mission:r.description||'',
instr:r.system_prompt||'',
model:r.model_name||'local-simulé',
caps:Array.isArray(r.capabilities)?r.capabilities:[],
tools:[],
perms:r.permissions||{},
state:r.status==='active'?'actif':'pause',
created:r.created_at||now(),
runs:existing?.runs||0,
fails:existing?.fails||0,
demo:0
};

if(existing){
Object.assign(existing,mapped);
}else{
S.agents.push(mapped);
}
}

save();
render();

return rows.length;
}
};

/* ================= AGENT RUNTIME IA ================= */

const Runtime={
async run(agent,task){

if(!agent){
throw new Error('Agent introuvable.');
}

if(agent.state!=='actif'){
throw new Error('Agent non actif.');
}

/* MODE LOCAL SIMULÉ */

if(agent.model.startsWith('local')){
await sleep(350);

return{
simule:true,
texte:
'[SIMULÉ — aucun modèle IA appelé]\n\n'+
agent.name+' a pris en charge : '+task.title+
'\n\nConnectez un modèle Gemini dans les paramètres de l’agent pour obtenir une véritable réponse IA.'
};
}

/* GEMINI VIA SUPABASE */

if(agent.model.startsWith('gemini-')){

if(!SB.session?.access_token){
throw new Error(
'Connexion Supabase requise. Connectez-vous dans Paramètres.'
);
}

const prompt=`
IDENTITÉ DE L'AGENT
Nom : ${agent.name}
Catégorie : ${agent.cat||'Agent spécialisé'}

MISSION
${agent.mission||'Assistance générale'}

INSTRUCTIONS SYSTÈME
${agent.instr||'Tu es un assistant professionnel, rigoureux et efficace.'}

CAPACITÉS
${(agent.caps||[]).join(', ')||'Assistance générale'}

TÂCHE
${task.desc||task.title}

TITRE DE LA TÂCHE
${task.title}

CONSIGNES
- Exécute la tâche et produis un résultat concret.
- Réponds en français sauf si la tâche demande une autre langue.
- Structure clairement le résultat.
- N'invente pas de faits.
- Signale les informations manquantes.
- Ne prétends pas avoir réalisé des actions externes non disponibles.
`;

const data=await SB.request('/functions/v1/ai-gateway',{
method:'POST',
body:JSON.stringify({
model:agent.model,
prompt:prompt
})
});

if(!data||data.success!==true){
throw new Error(
data?.error||
data?.message||
'Erreur du Gateway IA.'
);
}

if(!data.reply){
throw new Error('Réponse IA vide.');
}

return{
simule:false,
texte:data.reply,
model:data.model||agent.model,
usage:data.usage||null,
attempts:data.attempts||1
};
}

/* FOURNISSEURS NON CONFIGURÉS */

throw new Error(
'Fournisseur non configuré : '+agent.model
);
}
};

/* ================= ORCHESTRATEUR ================= */

const Orch={

plan(text,mode){
text=clean(text);

const w=text.toLowerCase();

const act=S.agents.filter(a=>a.state==='actif');

const sc=a=>
a.caps.reduce((n,c)=>n+(w.includes(c.slice(0,5))?2:0),0)+
a.mission.toLowerCase().split(/\W+/)
.filter(x=>x.length>4&&w.includes(x)).length;

let sel=act
.map(a=>[a,sc(a)])
.filter(x=>x[1]>0)
.sort((a,b)=>b[1]-a[1])
.map(x=>x[0])
.slice(0,Sec.MAX_TASKS);

if(!sel.length){
sel=act.filter(a=>a.caps.includes('coordination')).slice(0,1);
}

if(!sel.length&&act.length){
sel=[act[0]];
}

const corr=uid('co');
let prev=null;

const ts=sel.map(a=>{
const t={
id:uid('tk'),
title:a.name+' : '+text.slice(0,60),
desc:text,
agent:a.id,
prio:'normale',
created:now(),
due:'',
status:'validation',
deps:mode==='sequentiel'&&prev?[prev]:[],
result:null,
hist:[{ts:now(),s:'créée'}],
corr,
sensible:Sec.suspect(text)
};

prev=t.id;

return t;
});

ts.forEach(t=>{
S.tasks.unshift(t);
Bus.emit('TASK_CREATED','orchestrateur',{id:t.id},{corr});
});

audit('Plan orchestrateur',ts.length+' tâche(s), mode '+mode);

save();

return ts;
},

async exec(t,tries=0){

const a=S.agents.find(x=>x.id===t.agent);

if(!a){
t.status='erreur';
t.result={erreur:'Agent introuvable.'};
save();
render();
return;
}

t.status='en cours';
t.hist.push({ts:now(),s:'démarrée'});

Bus.emit('AGENT_STARTED',a.name,{task:t.id},{corr:t.corr});

render();

try{

const r=await Runtime.run(a,t);

t.result=r;
t.status='terminée';

a.runs++;

t.hist.push({ts:now(),s:'terminée'});

Bus.emit('TASK_COMPLETED',a.name,{task:t.id},{corr:t.corr});
Bus.emit('AGENT_COMPLETED',a.name,{task:t.id},{corr:t.corr});

}catch(e){

/* PAS DE RELANCE AUTOMATIQUE GEMINI */

if(
tries<Sec.MAX_RETRY&&
!a.model.startsWith('gemini-')&&
!/backend/i.test(e.message)
){
t.hist.push({ts:now(),s:'reprise '+(tries+1)});
return this.exec(t,tries+1);
}

t.status='erreur';
t.result={erreur:e.message};
a.fails++;

Bus.emit('AGENT_FAILED',a.name,{
msg:e.message,
task:t.id
},{corr:t.corr,prio:'haute'});

}

save();
render();
},

async approve(ids,mode){
const ts=ids.map(i=>S.tasks.find(t=>t.id===i)).filter(Boolean);

audit('Validation humaine',ts.length+' tâche(s)');

ts.forEach(t=>{
t.status='en attente';

Bus.emit('TASK_ASSIGNED','orchestrateur',{
task:t.id,
agent:t.agent
},{corr:t.corr});
});

if(mode==='parallele'){
await Promise.all(ts.map(t=>this.exec(t)));
}else{
for(const t of ts){
await this.exec(t);
}
}
}
};

/* ================= WORKFLOW ================= */

const STEPS=['agent','validation humaine','délai'];

const Flow={
async run(w){

const corr=uid('co');

Bus.emit('WORKFLOW_STARTED','workflow',{id:w.id},{corr});

const h={
ts:now(),
ok:true,
log:[]
};

for(const s of w.steps){

if(s.type==='délai'){
await sleep(Math.min(+s.val||1,5)*1000);
h.log.push('délai');
continue;
}

if(s.type==='validation humaine'){
if(!confirm('Validation requise : '+(s.val||'continuer ?'))){
h.ok=false;
h.log.push('refusé');
break;
}

h.log.push('validé');
continue;
}

const a=S.agents.find(x=>x.id===s.val);

if(!a){
h.ok=false;
h.log.push('agent introuvable');
break;
}

const t={
id:uid('tk'),
title:w.name+' → '+a.name,
desc:w.name,
agent:a.id,
prio:'normale',
created:now(),
due:'',
status:'en attente',
deps:[],
result:null,
hist:[],
corr
};

S.tasks.unshift(t);

await Orch.exec(t);

h.log.push(a.name+' : '+t.status);

if(t.status==='erreur'){
h.ok=false;
break;
}
}

w.hist=[h,...(w.hist||[])].slice(0,20);

Bus.emit('WORKFLOW_COMPLETED','workflow',{
id:w.id,
ok:h.ok
},{corr});

save();
render();
}
};

<label class="mu" style="display:block;margin-top:10px">Rétention mémoire (jours)</label>
<input id="ret" type="number" min="1" value="${S.cfg.retention}">
</div>

<div class="card">
<h3>Synchronisation</h3>

<div class="row">
<button class="btn" id="sbPush2">Envoyer mes agents vers Supabase</button>
<button class="btn" id="sbPull2">Récupérer les agents</button>
</div>
</div>

<div class="card">
<h3>Sauvegarde</h3>

<div class="row">
<button class="btn" id="exp">Exporter JSON</button>

<label class="btn">
Importer JSON
<input id="imp" type="file" accept=".json" hidden>
</label>

<button class="btn" id="leg">Importer Hub V1</button>
<button class="btn d" id="rst">Réinitialiser</button>
</div>

<p class="mu">Version ${VER} · stockage IndexedDB</p>
</div>
`;
}
};

/* ================= FORMULAIRE AGENT ================= */

function agentForm(g){

dlg(
g?'Modifier l’agent':'Nouvel agent',
[
{k:'name',l:'Nom',r:1},
{k:'cat',l:'Catégorie',t:'select',o:S.cats},
{k:'mission',l:'Mission',t:'area'},
{k:'instr',l:'Instructions système',t:'area'},
{k:'caps',l:'Capacités séparées par des virgules'},
{k:'model',l:'Modèle',t:'select',o:MODELS}
],
o=>{
const caps=o.caps.split(',').map(s=>s.trim()).filter(Boolean);

let a;

if(g){
Object.assign(g,{
name:o.name,
cat:o.cat,
mission:o.mission,
instr:o.instr,
caps,
model:o.model
});
a=g;
}else{
a={
...mkAgent(o.name,o.cat,o.mission,caps,0),
instr:o.instr,
model:o.model
};
S.agents.push(a);
Bus.emit('AGENT_CREATED','ui',{name:a.name});
}

save();

if(SB.session?.user?.id){
SB.upsertAgent(a)
.then(()=>toast('Agent synchronisé avec Supabase'))
.catch(e=>toast('Agent local. Synchronisation : '+e.message));
}else{
toast('Agent enregistré localement.');
}
},
g?{...g,caps:g.caps.join(', ')}:{}
);
}

/* ================= RENDU ================= */

function side(){
const s=$('#side');

s.innerHTML=`
<b>Activité récente</b>

${S.events.slice(0,12).map(e=>`
<div class="mu" style="margin-top:6px">
${fmt(e.ts)} · ${esc(e.type)}
</div>
`).join('')||'<div class="mu">Aucune activité.</div>'}

<p class="mu">Raccourci : / pour rechercher</p>
`;
}

function theme(){
const t=S.cfg.theme;

if(t==='auto'){
document.documentElement.removeAttribute('data-theme');
}else{
document.documentElement.dataset.theme=t;
}
}

function render(){
nav();

$('#main').innerHTML=
`<div class="row" style="justify-content:flex-end;margin-bottom:-8px">
<button class="btn s" id="sd">Panneau activité</button>
</div>`+
V[cur]();

$('#sd').onclick=()=>{
$('#side').classList.toggle('h');
side();
};

side();
bind();
}

/* ================= ACTIONS INTERFACE ================= */

function bind(){

const m=$('#main');
const $$=s=>m.querySelectorAll(s);
const on=(s,f)=>{
const e=m.querySelector(s);
if(e)e.onclick=f;
};

const qi=$('#q');

if(qi){
qi.oninput=()=>{
q=qi.value;
const p=qi.selectionStart;
render();
const n=$('#q');
if(n){
n.focus();
n.setSelectionRange(p,p);
}
};
}

/* ORCHESTRATEUR */

on('#go',()=>{
const t=$('#cmd').value.trim();

if(!t){
toast('Saisissez une instruction.');
return;
}

const r=Orch.plan(t,$('#cm').value);

if(Sec.suspect(t)){
Bus.emit('SYSTEM_ALERT','sécurité',{msg:'Instruction suspecte signalée'});
}

toast(r.length+' tâche(s) à valider');

cur='tasks';
render();
});

/* ACTIONS DES CARTES */

$$('[data-a]').forEach(b=>{
b.onclick=async()=>{
const a=b.dataset.a;
const i=b.dataset.i;

if(cur==='agents'){
const g=S.agents.find(x=>x.id===i);

if(a==='edit')agentForm(g);

if(a==='dup'){
S.agents.push({
...g,
id:uid('ag'),
name:g.name+' (copie)',
runs:0,
fails:0,
created:now()
});
save();
render();
}

if(a==='tog'){
g.state=g.state==='actif'?'pause':'actif';
audit('Agent '+g.state,g.name);
save();
render();
}

if(a==='test'){
const t={
id:uid('tk'),
title:'Test '+g.name,
desc:'Présente tes capacités, ta mission et ton fonctionnement.',
agent:g.id,
prio:'normale',
created:now(),
due:'',
status:'en attente',
deps:[],
result:null,
hist:[],
corr:uid('co')
};

S.tasks.unshift(t);
render();
await Orch.exec(t);
}

if(a==='del'){
askDel('Supprimer '+g.name+' ?',()=>{
S.agents=S.agents.filter(x=>x!==g);
audit('Agent supprimé',g.name);
});
}
}

else if(cur==='tasks'){

if(a==='ok'){
await Orch.approve([i],'sequentiel');
}

if(a==='retry'){
const t=S.tasks.find(t=>t.id===i);
if(t)await Orch.exec(t);
}

if(a==='del'){
askDel('Supprimer cette tâche ?',()=>{
S.tasks=S.tasks.filter(t=>t.id!==i);
});
}

}

else if(cur==='flows'){

const w=S.workflows.find(x=>x.id===i);

if(a==='run')Flow.run(w);

if(a==='tog'){
w.on=!w.on;
save();
render();
}

if(a==='dup'){
S.workflows.push({
...w,
id:uid('wf'),
name:w.name+' (copie)',
hist:[]
});
save();
render();
}

if(a==='step'){
dlg(
'Ajouter une étape',
[
{k:'type',l:'Type',t:'select',o:STEPS},
{k:'val',l:'Agent ou valeur',t:'select',o:[
{v:'',l:'—'},
...S.agents.map(g=>({v:g.id,l:g.name}))
]}
],
o=>w.steps.push({type:o.type,val:o.val})
);
}

if(a==='del'){
askDel('Supprimer ce workflow ?',()=>{
S.workflows=S.workflows.filter(x=>x!==w);
});
}
}

else if(cur==='conn'){

S.conn[i]=!S.conn[i];

audit('Connecteur démo',i+' '+(S.conn[i]?'activé':'désactivé'));

Bus.emit(
S.conn[i]?'CONNECTOR_CONNECTED':'CONNECTOR_DISCONNECTED',
'connecteurs',
{name:i,simule:true}
);

render();
}

else if(cur==='kb'&&a==='del'){
askDel('Supprimer ?',()=>{
S.kb=S.kb.filter(x=>x.id!==i);
});
}

else if(cur==='mem'&&a==='del'){
askDel('Effacer cette mémoire ?',()=>{
S.mem=S.mem.filter(x=>x.id!==i);
});
}
};
});

/* AJOUT */

on('#add',()=>{

const ag=[
{v:'',l:'—'},
...S.agents.map(g=>({v:g.id,l:g.name}))
];

if(cur==='agents'){
agentForm();
}

if(cur==='flows'){
dlg('Nouveau workflow',[
{k:'name',l:'Nom',r:1}
],o=>S.workflows.push({
id:uid('wf'),
name:o.name,
steps:[],
on:false,
hist:[]
}));
}

if(cur==='tasks'){
dlg('Nouvelle tâche',[
{k:'title',l:'Titre',r:1},
{k:'agent',l:'Agent',t:'select',o:ag.slice(1)},
{k:'prio',l:'Priorité',t:'select',o:['basse','normale','haute']}
],o=>S.tasks.unshift({
id:uid('tk'),
title:o.title,
desc:o.title,
agent:o.agent,
prio:o.prio,
created:now(),
due:'',
status:'validation',
deps:[],
result:null,
hist:[{ts:now(),s:'créée'}],
corr:uid('co')
}));
}

if(cur==='kb'){
dlg('Document',[
{k:'title',l:'Titre',r:1},
{k:'tag',l:'Catégorie'},
{k:'agent',l:'Rattaché à',t:'select',o:ag},
{k:'body',l:'Contenu',t:'area'}
],o=>S.kb.push({id:uid('kb'),...o}));
}

if(cur==='mem'){
dlg('Mémoire',[
{k:'agent',l:'Agent',t:'select',o:ag.slice(1)},
{k:'scope',l:'Portée',t:'select',o:['privée','partagée']},
{k:'text',l:'Contenu',t:'area'}
],o=>S.mem.push({
id:uid('mm'),
ts:now(),
...o
}));
}
});

/* TÂCHES */

on('#okall',async()=>{
const ids=S.tasks.filter(t=>t.status==='validation').map(t=>t.id);
await Orch.approve(ids,'sequentiel');
});

const vw=$('#vw');

if(vw){
vw.onchange=()=>{
view=vw.value;
render();
};
}

/* COMMUNICATIONS */

on('#ping',()=>{
Bus.emit('SYSTEM_ALERT','ui',{msg:'Test manuel'},{prio:'haute'});
render();
});

/* MÉMOIRE */

on('#purge',()=>{
const lim=Date.now()-S.cfg.retention*864e5;
const n=S.mem.length;
S.mem=S.mem.filter(x=>new Date(x.ts)>lim);
toast((n-S.mem.length)+' mémoire(s) supprimée(s)');
save();
render();
});

/* SUPABASE SETTINGS */

const sburl=$('#sburl');
const sbkey=$('#sbkey');

on('#sbSave',()=>{
S.cfg.sburl=sburl.value.trim();
S.cfg.sbkey=sbkey.value.trim();
save();
toast('Configuration Supabase enregistrée.');
});

on('#sbTest',async()=>{
try{
S.cfg.sburl=sburl.value.trim();
S.cfg.sbkey=sbkey.value.trim();
save();

await SB.test();

toast('Supabase REST opérationnel.');
}catch(e){
toast('Test Supabase : '+e.message);
}
});

on('#sbSign',async()=>{
try{
S.cfg.sburl=sburl.value.trim();
S.cfg.sbkey=sbkey.value.trim();
save();

const d=await SB.auth(
'signup',
$('#sbemail').value,
$('#sbpass').value
);

$('#sbStatus').textContent=d.access_token
?'Compte créé et connecté.'
:'Compte créé. Confirmez votre e-mail.';

toast(d.access_token?'Inscription réussie':'Confirmation e-mail requise');

render();

}catch(e){
$('#sbStatus').textContent='Inscription : '+e.message;
toast(e.message);
}
});

on('#sbLogin',async()=>{
try{
S.cfg.sburl=sburl.value.trim();
S.cfg.sbkey=sbkey.value.trim();
save();

const d=await SB.auth(
'login',
$('#sbemail').value,
$('#sbpass').value
);

$('#sbStatus').textContent='Connecté : '+(d.user?.email||'utilisateur');

toast('Connexion Supabase réussie');

render();

}catch(e){
$('#sbStatus').textContent='Connexion : '+e.message;
toast(e.message);
}
});

on('#sbLogout',()=>{
SB.logout();
$('#sbStatus').textContent='Session déconnectée';
toast('Déconnexion Supabase.');
render();
});

async function pushAgents(){
try{
S.cfg.sburl=sburl.value.trim();
S.cfg.sbkey=sbkey.value.trim();
save();

const n=await SB.push();

toast(n+' agent(s) synchronisé(s).');
}catch(e){
toast('Synchronisation : '+e.message);
}
}

async function pullAgents(){
try{
S.cfg.sburl=sburl.value.trim();
S.cfg.sbkey=sbkey.value.trim();
save();

const n=await SB.pull();

toast(n+' agent(s) importé(s).');
}catch(e){
toast('Import : '+e.message);
}
}

on('#sbPush',pushAgents);
on('#sbPush2',pushAgents);
on('#sbPull',pullAgents);
on('#sbPull2',pullAgents);

/* MODÈLE */

on('#modelSave',()=>{
S.cfg.model=$('#defaultModel').value;
save();
toast('Modèle enregistré.');
});

on('#th',()=>{
S.cfg.theme=$('#th').value;
theme();
save();
});

const rt=$('#ret');

if(rt){
rt.onchange=()=>{
S.cfg.retention=Math.max(1,+rt.value||90);
save();
};
}

/* EXPORT */

on('#exp',()=>{
const a=document.createElement('a');

a.href=URL.createObjectURL(
new Blob([JSON.stringify(S,null,2)],{type:'application/json'})
);

a.download='mon_hub_multi_agents_v3.json';
a.click();

URL.revokeObjectURL(a.href);
});

/* IMPORT */

const im=$('#imp');

if(im){
im.onchange=async()=>{
try{
migrate(JSON.parse(await im.files[0].text()));
save();
toast('Sauvegarde restaurée.');
render();
}catch{
toast('Fichier JSON invalide.');
}
};
}

/* IMPORT V1 */

on('#leg',()=>{
const n=importLegacy();

toast(n?n+' agent(s) importé(s)':'Aucune donnée V1 trouvée');

save();
render();
});

/* RESET */

on('#rst',()=>{
askDel('Réinitialiser le Hub ? Cette action est irréversible.',()=>{
S=defaults();
SB.logout();
});
});

}

/* ================= INITIALISATION ================= */

document.addEventListener('keydown',e=>{
if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;

if(e.key==='/'){
e.preventDefault();
const n=$('#q');
if(n)n.focus();
}

if(e.key==='Escape'){
const d=$('#dlg');
if(d.open)d.close();
}
});

(async()=>{
await Persist.init();

const d=await Persist.load();

if(d){
migrate(d);
}else{
const n=importLegacy();
if(n)toast(n+' agent(s) importé(s) depuis V1');
}

await SB.restore();

theme();
render();

audit('Hub démarré','Version '+VER);
})();
</script>
</body>
</html>
